services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        working_dir: /var/www/html
        env_file:
            - path: .env
              required: false
        environment:
            DB_CONNECTION: mysql
            DB_HOST: mysql
            DB_PORT: 3306
            DB_DATABASE: bumpa
            DB_USERNAME: bumpa
            DB_PASSWORD: bumpa
            CACHE_STORE: redis
            QUEUE_CONNECTION: redis
            REDIS_HOST: redis
        volumes:
            - ./:/var/www/html
            - vendor:/var/www/html/vendor
            - storage:/var/www/html/storage
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy

    web:
        image: nginx:1.27-alpine
        ports:
            - "8000:80"
        volumes:
            - ./:/var/www/html:ro
            - storage:/var/www/html/storage:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app

    worker:
        build:
            context: .
            dockerfile: Dockerfile
        working_dir: /var/www/html
        command: php artisan queue:work redis --sleep=1 --tries=3 --timeout=90
        env_file:
            - path: .env
              required: false
        environment:
            DB_CONNECTION: mysql
            DB_HOST: mysql
            DB_PORT: 3306
            DB_DATABASE: bumpa
            DB_USERNAME: bumpa
            DB_PASSWORD: bumpa
            CACHE_STORE: redis
            QUEUE_CONNECTION: redis
            REDIS_HOST: redis
        volumes:
            - ./:/var/www/html
            - vendor:/var/www/html/vendor
            - storage:/var/www/html/storage
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy

    scheduler:
        build:
            context: .
            dockerfile: Dockerfile
        working_dir: /var/www/html
        command: php artisan schedule:work
        env_file:
            - path: .env
              required: false
        environment:
            DB_CONNECTION: mysql
            DB_HOST: mysql
            DB_PORT: 3306
            DB_DATABASE: bumpa
            DB_USERNAME: bumpa
            DB_PASSWORD: bumpa
            CACHE_STORE: redis
            QUEUE_CONNECTION: redis
            REDIS_HOST: redis
        volumes:
            - ./:/var/www/html
            - vendor:/var/www/html/vendor
            - storage:/var/www/html/storage
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy

    mysql:
        image: mysql:8.4
        environment:
            MYSQL_DATABASE: bumpa
            MYSQL_USER: bumpa
            MYSQL_PASSWORD: bumpa
            MYSQL_ROOT_PASSWORD: root
        ports:
            - "3307:3306"
        volumes:
            - mysql_data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
            interval: 5s
            timeout: 5s
            retries: 20

    redis:
        image: redis:7-alpine
        ports:
            - "6380:6379"
        volumes:
            - redis_data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 20

volumes:
    mysql_data:
    redis_data:
    vendor:
    storage:
